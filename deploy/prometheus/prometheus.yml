global:
  scrape_interval: 10s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  # Workers scale with `--scale`; DNS returns one A record per replica.
  - job_name: workers
    dns_sd_configs:
      - names: ["worker-cpu", "worker-gpu"]
        type: A
        port: 9100
